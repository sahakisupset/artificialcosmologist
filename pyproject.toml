[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmo-research"
version = "0.1.0"
description = "Literature retrieval and assumption auditing for cosmology research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "feedparser>=6.0",
  "chromadb>=0.5",
  "openai>=1.40",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "truststore>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-httpx>=0.30", "ruff>=0.5"]

[project.scripts]
cosmo-research = "cosmo_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
